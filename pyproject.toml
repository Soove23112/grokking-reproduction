[project]
name = "grokking"
version = "1.0.0"
description = "Reproduction of Nanda et al. 2023, Progress measures for grokking via mechanistic interpretability"
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.5.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grokking"]
